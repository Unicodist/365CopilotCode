name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: xvfb-run -a npm test
      - name: Package extension
        run: npm run package -- --out "365-copilot-code-${GITHUB_SHA::7}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: 365-copilot-code-vsix
          path: "*.vsix"
          if-no-files-found: error
